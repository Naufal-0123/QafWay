<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: layar penuh sampai area poni/notch; konten dijaga lewat env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef4f2" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="QafWay" />
    <title>QafWay</title>
    <!-- Pemulihan otomatis: jika file JS/CSS di /assets/ gagal dimuat (misalnya salinan lama
         halaman menunjuk ke file deploy sebelumnya), hapus service worker + cache lalu muat ulang sekali. -->
    <script>
      window.addEventListener(
        "error",
        function (e) {
          var t = e.target;
          if (!t || !t.tagName || (t.tagName !== "SCRIPT" && t.tagName !== "LINK")) return;
          var url = t.src || t.href || "";
          if (url.indexOf("/assets/") === -1) return;
          try {
            if (sessionStorage.getItem("qafway-recovered")) return; // cukup sekali, cegah loop
            sessionStorage.setItem("qafway-recovered", "1");
          } catch (err) {
            return;
          }
          var jobs = [];
          if (navigator.serviceWorker)
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }),
            );
          if (window.caches)
            jobs.push(
              caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }),
            );
          Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
        },
        true,
      );
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
