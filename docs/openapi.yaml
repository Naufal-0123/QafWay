openapi: 3.0.3
info:
  title: e-Quran API (backend Go)
  version: 0.1.0
  description: |
    Kontrak API backend e-Quran untuk frontend Vue.
    Rilis: V1 = surah, jadwal sholat, kalender Hijriyah | V2 = audio, tafsir, puasa |
    V3 = pencarian ayat | V4 = hafalan | V5 = tajwid, kuis, asbabun nuzul.
    Proyek ini TANPA LOGIN: penanda, catatan, tilawah, hafalan, dan kuis disimpan di browser (tanpa endpoint).
    Sumber data: surah/tafsir/audio dari equran.id (v2, di-cache backend); fitur lain
    memakai data sendiri atau sumber yang masih perlu diverifikasi (ditandai x-source).
servers:
  - url: http://localhost:8080/api/v1
tags:
  - { name: Quran }
  - { name: Search }
  - { name: Prayer }
  - { name: Hijri }
  - { name: Reminder }
  - { name: Dzikir & Doa }
  - { name: Learn }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Nomor:
      {
        name: nomor,
        in: path,
        required: true,
        schema: { type: integer, minimum: 1, maximum: 114 },
      }
    Ayat:
      {
        name: ayat,
        in: path,
        required: true,
        schema: { type: integer, minimum: 1 },
      }
    Id: { name: id, in: path, required: true, schema: { type: string } }
    Page: { name: page, in: query, schema: { type: integer, default: 1 } }
    Limit:
      {
        name: limit,
        in: query,
        schema: { type: integer, default: 20, maximum: 100 },
      }
    Lat: { name: lat, in: query, required: true, schema: { type: number } }
    Lng: { name: lng, in: query, required: true, schema: { type: number } }
    Year: { name: year, in: query, required: true, schema: { type: integer } }
    Month:
      {
        name: month,
        in: query,
        required: true,
        schema: { type: integer, minimum: 1, maximum: 12 },
      }
  responses:
    Ok:
      {
        description: Berhasil,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Envelope" } },
          },
      }
    Created:
      {
        description: Dibuat,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Envelope" } },
          },
      }
    NoContent: { description: Berhasil tanpa isi }
    Unauthorized: { description: Token tidak ada/tidak valid }
    NotFound: { description: Tidak ditemukan }
  schemas:
    Envelope:
      type: object
      properties:
        data: {}
        error: { type: string, nullable: true }
    Credentials:
      type: object
      required: [email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    Surah:
      type: object
      properties:
        nomor: { type: integer }
        nama: { type: string }
        namaLatin: { type: string }
        jumlahAyat: { type: integer }
        tempatTurun: { type: string }
        arti: { type: string }
        deskripsi: { type: string }
        audioFull:
          {
            type: object,
            additionalProperties: { type: string },
            description: "ID qari 01-06 -> URL",
          }
    Ayah:
      type: object
      properties:
        nomorAyat: { type: integer }
        teksArab: { type: string }
        teksLatin: { type: string }
        teksIndonesia: { type: string }
        audio: { type: object, additionalProperties: { type: string } }
    Bookmark:
      type: object
      properties:
        id: { type: string }
        surah: { type: integer }
        ayat: { type: integer }
        createdAt: { type: string, format: date-time }
    Note:
      type: object
      properties:
        id: { type: string }
        surah: { type: integer }
        ayat: { type: integer }
        text: { type: string }
    ReminderSettings:
      type: object
      properties:
        cityId: { type: string }
        method: { type: string, example: kemenag }
        prayers:
          type: object
          description: "subuh, dzuhur, ashar, maghrib, isya"
          additionalProperties:
            type: object
            properties:
              enabled: { type: boolean }
              minutesBefore: { type: integer, default: 0 }
    PushSubscription:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string }
        keys:
          type: object
          properties: { p256dh: { type: string }, auth: { type: string } }
    UserSettings:
      type: object
      properties:
        theme: { type: string, enum: [light, dark, system] }
        arabicFontSize: { type: integer }
        qari: { type: string, example: "01" }
        showLatin: { type: boolean }
        showTranslation: { type: boolean }
        language: { type: string, enum: [id, en] }
    TilawahTarget:
      type: object
      properties:
        startDate: { type: string, format: date }
        targetDays:
          { type: integer, description: "mis. 30 untuk khatam sebulan" }
paths:
  /health:
    get:
      {
        summary: Cek status server,
        responses: { "200": { $ref: "#/components/responses/Ok" } },
      }

  # ---------- Quran ----------
  /surahs:
    get:
      tags: [Quran]
      summary: Daftar 114 surah, filter nama dengan q (V1)
      x-source: equran.id GET /api/v2/surat (di-cache)
      parameters: [{ name: q, in: query, schema: { type: string } }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /surahs/{nomor}:
    get:
      tags: [Quran]
      summary: Detail surah + ayat + audio per qari (V1 teks, V2 audio)
      x-source: equran.id GET /api/v2/surat/{nomor}
      parameters: [{ $ref: "#/components/parameters/Nomor" }]
      responses:
        {
          "200": { $ref: "#/components/responses/Ok" },
          "404": { $ref: "#/components/responses/NotFound" },
        }
  /surahs/{nomor}/tafsir:
    get:
      tags: [Quran]
      summary: Tafsir seluruh ayat dalam satu surah (V2)
      x-source: equran.id GET /api/v2/tafsir/{nomor}
      parameters: [{ $ref: "#/components/parameters/Nomor" }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /surahs/{nomor}/ayahs/{ayat}/asbabun-nuzul:
    get:
      tags: [Learn]
      summary: Latar turunnya ayat (V5)
      x-source: PERLU sumber data + lisensi
      parameters:
        [
          { $ref: "#/components/parameters/Nomor" },
          { $ref: "#/components/parameters/Ayat" },
        ]
      responses:
        {
          "200": { $ref: "#/components/responses/Ok" },
          "404": { $ref: "#/components/responses/NotFound" },
        }
  /surahs/{nomor}/tajwid:
    get:
      tags: [Learn]
      summary: Teks Arab per ayat dengan penanda hukum tajwid (potongan teks + nama hukum)
      x-source: UmmahAPI GET /api/quran/surah/{n}?script=tajweed (diparse dan di-cache di backend)
      parameters: [{ $ref: "#/components/parameters/Nomor" }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /ayahs/random:
    get:
      tags: [Quran]
      summary: Ayat acak dengan konteks surah (V3)
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /ayahs/daily:
    get:
      tags: [Quran]
      summary: Ayat harian (sama untuk semua pengguna pada tanggal yang sama)
      description: Dipilih deterministik dari seluruh ayat berdasarkan tanggal. Tanpa date dipakai tanggal hari ini (WIB).
      parameters:
        [{ name: date, in: query, schema: { type: string, format: date } }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /qaris:
    get:
      tags: [Quran]
      summary: Daftar qari (ID 01-06) untuk pilihan audio (V2)
      responses: { "200": { $ref: "#/components/responses/Ok" } }

  # ---------- Search (V3) ----------
  /search/ayahs:
    get:
      tags: [Search]
      summary: Cari ayat berdasarkan kata di terjemahan atau teks Arab (V3)
      parameters:
        - {
            name: q,
            in: query,
            required: true,
            schema: { type: string, minLength: 2 },
          }
        - {
            name: scope,
            in: query,
            schema:
              {
                type: string,
                enum: [translation, arabic],
                default: translation,
              },
          }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses: { "200": { $ref: "#/components/responses/Ok" } }

  # ---------- Prayer (V1) ----------
  /prayer/provinces:
    get:
      tags: [Prayer]
      summary: Daftar provinsi yang punya jadwal sholat (V1)
      x-source: equran.id GET /api/v2/shalat/provinsi (data Bimas Islam Kemenag RI)
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /prayer/cities:
    get:
      tags: [Prayer]
      summary: Daftar kabupaten/kota dalam satu provinsi (V1)
      x-source: equran.id POST /api/v2/shalat/kabkota
      parameters:
        - {
            name: provinsi,
            in: query,
            required: true,
            schema: { type: string },
          }
      responses:
        {
          "200": { $ref: "#/components/responses/Ok" },
          "404": { $ref: "#/components/responses/NotFound" },
        }
  /prayer/times:
    get:
      tags: [Prayer]
      summary: Jadwal sholat sebulan, atau satu hari jika date diisi (V1)
      description: |
        Wilayah dipilih lewat nama provinsi dan kabkota persis seperti dari /prayer/cities.
        Tanpa year/month/date = bulan berjalan. Waktu berformat HH:mm menurut zona waktu wilayah.
        "Sholat berikutnya" dan hitung mundur dihitung di frontend (zona waktu wilayah tidak disediakan sumber data).
      x-source: equran.id POST /api/v2/shalat
      parameters:
        - {
            name: provinsi,
            in: query,
            required: true,
            schema: { type: string },
          }
        - { name: kabkota, in: query, required: true, schema: { type: string } }
        - { name: year, in: query, schema: { type: integer } }
        - {
            name: month,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 12 },
          }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        {
          "200": { $ref: "#/components/responses/Ok" },
          "404": { $ref: "#/components/responses/NotFound" },
        }
  /qibla:
    get:
      tags: [Prayer]
      summary: Sudut arah kiblat dari koordinat (V4)
      parameters:
        [
          { $ref: "#/components/parameters/Lat" },
          { $ref: "#/components/parameters/Lng" },
        ]
      responses: { "200": { $ref: "#/components/responses/Ok" } }

  # ---------- Hijri (V1, V2) ----------
  /hijri/today:
    get:
      tags: [Hijri]
      summary: Tanggal Hijriyah hari ini, termasuk offset koreksi (V1)
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /hijri/calendar:
    get:
      tags: [Hijri]
      summary: Kalender bulanan Masehi + Hijriyah + hari besar (V1)
      parameters:
        [
          { $ref: "#/components/parameters/Year" },
          { $ref: "#/components/parameters/Month" },
        ]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /hijri/convert:
    get:
      tags: [Hijri]
      summary: Konversi Masehi <-> Hijriyah (V1)
      parameters:
        - { name: gregorian, in: query, schema: { type: string, format: date } }
        - {
            name: hijri,
            in: query,
            schema: { type: string, example: "1448-09-01" },
          }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /hijri/events:
    get:
      tags: [Hijri]
      summary: Daftar hari besar Islam pada tahun Hijriyah/Masehi (V1)
      parameters: [{ name: year, in: query, schema: { type: integer } }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /fasting/schedule:
    get:
      tags: [Hijri]
      summary: Jadwal puasa sunnah sebulan (Senin-Kamis, Ayyamul Bidh, Arafah, Asyura, dll) (V2)
      parameters:
        [
          { $ref: "#/components/parameters/Year" },
          { $ref: "#/components/parameters/Month" },
        ]
      responses: { "200": { $ref: "#/components/responses/Ok" } }

  # ---------- Web Push (tanpa akun) ----------
  /push/vapid-public-key:
    get:
      tags: [Reminder]
      summary: (DITUNDA) Kunci publik VAPID untuk berlangganan Web Push (503 jika belum dikonfigurasi)
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /push/subscriptions:
    post:
      tags: [Reminder]
      summary: (DITUNDA) Daftarkan atau perbarui langganan pengingat sholat perangkat ini
      description: |
        Anonim (tanpa login). Hanya endpoint dari layanan push browser besar yang diterima.
        Server mengirim notifikasi pada waktu sholat menurut zona waktu provinsi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription, provinsi, kabkota]
              properties:
                subscription: { $ref: "#/components/schemas/PushSubscription" }
                provinsi: { type: string }
                kabkota: { type: string }
                lead:
                  {
                    type: integer,
                    enum: [0, 5, 10, 15],
                    description: "menit sebelum waktu sholat",
                  }
      responses:
        {
          "201": { $ref: "#/components/responses/Created" },
          "400": { description: Data tidak valid },
          "404": { $ref: "#/components/responses/NotFound" },
        }
    delete:
      tags: [Reminder]
      summary: (DITUNDA) Hentikan langganan perangkat ini
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [endpoint],
                    properties: { endpoint: { type: string } },
                  },
              },
          }
      responses: { "200": { $ref: "#/components/responses/Ok" } }

  # ---------- Doa & Dzikir ----------
  /doa:
    get:
      tags: [Dzikir & Doa]
      summary: Daftar doa & dzikir (228 bacaan), dengan filter opsional
      x-source: equran.id GET /api/doa (di-cache, difilter di backend)
      parameters:
        - { name: grup, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - {
            name: q,
            in: query,
            description: "cari di nama, arti, latin, tag",
            schema: { type: string },
          }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /doa/{id}:
    get:
      tags: [Dzikir & Doa]
      summary: Detail satu doa (id numerik dari daftar)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        {
          "200": { $ref: "#/components/responses/Ok" },
          "404": { $ref: "#/components/responses/NotFound" },
        }
